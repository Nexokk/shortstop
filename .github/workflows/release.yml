name: Release

# Pousser un tag vX.Y.Z (ex. v1.2.0) compile l'APK signé et le publie dans une Release GitHub.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Calculer la version depuis le tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Restaurer le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compiler l'APK release
        env:
          SHORTSTOP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SHORTSTOP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHORTSTOP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHORTSTOP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk \
            "shortstop-${{ steps.version.outputs.name }}.apk"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: shortstop-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
